# Reusable CI for node repos (docs/ci.md). Callers override any input; an empty command skips its step.
# Commands run as shell: pass only fixed text, never event data such as PR titles or branch names.
name: ci-node
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      cache:
        type: string
        default: "npm"
      cache-dependency-path:
        type: string
        default: ""
      install:
        type: string
        default: "npm ci"
      lint:
        type: string
        default: "npm run lint --if-present"
      typecheck:
        type: string
        default: "if [ -f tsconfig.json ]; then npx tsc --noEmit; fi"
      test:
        type: string
        default: "npm test"
      audit:
        type: string
        default: "npm audit --audit-level=high"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          package-manager-cache: ${{ inputs.cache != '' }}
      - if: inputs.install != ''
        run: ${{ inputs.install }}
      - if: inputs.lint != ''
        run: ${{ inputs.lint }}
      - if: inputs.typecheck != ''
        run: ${{ inputs.typecheck }}
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          package-manager-cache: ${{ inputs.cache != '' }}
      - if: inputs.install != ''
        run: ${{ inputs.install }}
      - if: inputs.test != ''
        run: ${{ inputs.test }}
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          package-manager-cache: ${{ inputs.cache != '' }}
      - if: inputs.install != ''
        run: ${{ inputs.install }}
      - if: inputs.audit != ''
        run: ${{ inputs.audit }}
